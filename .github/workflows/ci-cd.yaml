name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/log-generator
  GO_VERSION: '1.21'

jobs:
  # Lint and format check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum
          cache: true

      - name: Download Go modules
        working-directory: app
        run: go mod download

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6.5.0
        with:
          version: v1.64.8
          working-directory: app
          args: --modules-download-mode=mod

      - name: Check Go formatting
        working-directory: app
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

  # Unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum
          cache: true

      - name: Download dependencies
        working-directory: app
        run: go mod tidy

      - name: Run tests
        working-directory: app
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5.4.0
        with:
          files: app/coverage.out
          flags: unittests
          name: codecov-umbrella


  # Build Docker image
  build:
    name: Build
    runs-on: ubuntu-latest


    needs: test
    permissions:
      packages: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to Kubernetes (for main and develop branches)
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: "(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'"
    environment:
      name: "${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}"
    concurrency:
      group: "${{ github.ref == 'refs/heads/main' && 'deploy-production' || 'deploy-development' }}"
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/log-generator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4.0.0
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes credentials
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::KUBE_CONFIG secret is not set or is empty"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config view --minify > /dev/null
          if ! kubectl get nodes > /dev/null 2>&1; then
            echo "::warning::kubectl get nodes failed — cluster may not be reachable, but proceeding with deployment"
          fi
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          for manifest in k8s/*.yaml; do
            echo "Validating $manifest..."
            kubectl apply --dry-run=client --validate=true -f "$manifest"
          done

      - name: Update image tag in deployment
        id: image
        run: |
          set -euo pipefail
          IMAGE_TAG="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
          echo "Updating image to: $IMAGE_TAG"
          cp k8s/04-log-generator.yaml k8s/04-log-generator.yaml.bak
          sed -i "s|image: log-aggregator-log-generator:latest|image: ${IMAGE_TAG}|g" k8s/04-log-generator.yaml
          if ! grep -q "$IMAGE_TAG" k8s/04-log-generator.yaml; then
            echo "::error::Failed to update image tag in deployment manifest"
            exit 1
          fi
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to Kubernetes (logs-only stack)
        id: deploy
        run: |
          set -euo pipefail
          # INTENTIONAL FAILURE FOR DEMONSTRATION - Simulating deployment failure
          echo "::error::Simulating deployment failure for rollback demonstration"
          kubectl apply -f "k8s/non-existent-manifest-for-rollback-demo.yaml" || true
          exit 1
          # END INTENTIONAL FAILURE
          manifests=(
            "k8s/00-namespace.yaml"
            "k8s/01-loki.yaml"
            "k8s/02-promtail.yaml"
            "k8s/03-grafana.yaml"
            "k8s/04-log-generator.yaml"
          )
          for manifest in "${manifests[@]}"; do
            echo "Applying $manifest..."
            for attempt in 1 2 3; do
              if kubectl apply -f "$manifest"; then
                echo "Successfully applied $manifest"
                break
              else
                if [[ $attempt -eq 3 ]]; then
                  echo "::error::Failed to apply $manifest after 3 attempts"
                  exit 1
                fi
                echo "::warning::Attempt $attempt failed, retrying in 5 seconds..."
                sleep 5
              fi
            done
          done
          echo "Waiting for deployment rollout..."
          kubectl rollout status deployment/log-generator -n logging --timeout=180s
          GRAFANA_PORT=$(kubectl get svc -n logging grafana -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}' 2>/dev/null || echo "3000")
          echo "application_url=http://localhost:${GRAFANA_PORT}" >> $GITHUB_OUTPUT

      - name: Verify deployment health
        id: verify
        run: |
          kubectl get pods -n logging
          kubectl get services -n logging

          set -euo pipefail
          echo "=== Deployment Status ==="
          kubectl get pods -n logging -o wide
          kubectl get services -n logging
          kubectl get deployments -n logging
          echo ""
          echo "=== Pod Health Check ==="
          READY_PODS=$(kubectl get pods -n logging -l app=log-generator -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | tr ' ' '\n' | grep -c "True" || echo "0")
          TOTAL_PODS=$(kubectl get pods -n logging -l app=log-generator -o jsonpath='{.items[*].metadata.name}' | wc -w)
          echo "Ready pods: $READY_PODS / $TOTAL_PODS"
          if [[ "$READY_PODS" -lt "$TOTAL_PODS" ]]; then
            echo "::error::Not all pods are ready"
            kubectl logs -n logging -l app=log-generator --tail=50 || true
            exit 1
          fi
          echo ""
          echo "=== Recent Logs ==="
          kubectl logs -n logging -l app=log-generator --tail=20 || true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Deployment failed, attempting rollback..."
          if [[ -f k8s/04-log-generator.yaml.bak ]]; then
            mv k8s/04-log-generator.yaml.bak k8s/04-log-generator.yaml
          fi
          kubectl rollout undo deployment/log-generator -n logging || true
          kubectl rollout status deployment/log-generator -n logging --timeout=120s || true
          echo "Rollback completed. Please investigate the deployment failure."

      - name: Cleanup backup files
        if: always()
        run: |
          rm -f k8s/04-log-generator.yaml.bak || true

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum
          cache: true

      - name: Download Go modules
        working-directory: app
        run: go mod download

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Run Gosec Security Scanner
        working-directory: app
        run: gosec ./...

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner (filesystem)
        run: |
          trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 app

  # Notify on success or failure
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, deploy-k8s]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.deploy-k8s.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        if: github.event_name == 'push'
        run: |
          echo "Pipeline ${{ steps.status.outputs.status }}"
          # Add notification logic here (Slack, email, etc.)
